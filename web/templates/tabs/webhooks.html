<!-- TAB: WEBHOOKS DISCORD (Dockraft Style) -->
<div class="card">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px;">
    <div>
      <h2 style="margin: 0; font-size: 1.3rem; font-weight: 700; color: #f0f6fc; display: flex; align-items: center; gap: 8px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span>Integración con Discord Webhooks</span>
      </h2>
      <p style="margin: 4px 0 0 0; color: var(--text-dim); font-size: 0.85rem;">
        Notificaciones enriquecidas con embeds para inicio, paradas programadas, dino wipes y copias de seguridad.
      </p>
    </div>
  </div>

  <div class="form-group" style="max-width: 680px; margin-bottom: 18px;">
    <label class="form-label" for="webhook-url">Discord Webhook URL</label>
    <input type="text" id="webhook-url" class="form-input" placeholder="https://discord.com/api/webhooks/..." style="font-family: var(--font-mono); font-size: 0.85rem;">
    <small style="color: var(--text-dim); font-size: 0.75rem; margin-top: 4px; display: block;">
      Copia la URL del Webhook desde Discord (Ajustes del Canal &rarr; Integraciones &rarr; Webhooks).
    </small>
  </div>

  <div style="display: flex; gap: 10px;">
    <button class="btn btn-primary" onclick="saveWebhookSettings()" style="padding: 7px 18px; font-size: 0.84rem;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      <span>Guardar Webhook</span>
    </button>
    <button class="btn btn-outline" onclick="testWebhookNotification()" style="padding: 7px 16px; font-size: 0.84rem;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      <span>Probar Notificación</span>
    </button>
  </div>
</div>
