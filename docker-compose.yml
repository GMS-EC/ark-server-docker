---
name: ark-server
services:
  ark-server:
    image: marcusm99/ark-server-docker:latest
    platform: linux/amd64
    restart: unless-stopped
    container_name: ark-server
    stop_grace_period: 30s
    # Límite de RAM del contenedor. Cambia el valor según cuánta
    # memoria quieras asignarle a tu servidor (ej. 8g, 12g, 16g).
    mem_limit: 12g
    ports:
      - "7777:7777/udp"    # Puerto Juego (UDP) - Conexión de Jugadores
      - "27015:27015/udp"  # Puerto Query Steam (UDP) - Buscador de Servidores
      - "27020:27020/tcp"  # Puerto RCON (TCP) - Consola Remota
      # - "8080:8080/tcp"  # Puerto Web UI Dashboard (Descomenta si activas WEBUI_ENABLED=true)
    environment:
      # --- Essential Server Settings ---
      - SESSION_NAME=ARK Server
      - SERVER_PASSWORD=
      - ADMIN_PASSWORD=adminpass
      - MAX_PLAYERS=10
      - WORLD=TheIsland
      - SERVER_PVE=false
      - BATTLEEYE=false
      - RCON_ENABLED=true
      - MOD_IDS=
      # --- Web UI Dashboard ---
      - WEBUI_ENABLED=false
      - WEBUI_PORT=8080
      # --- Backup Settings ---
      - BACKUP_ENABLED=true
      - BACKUP_INTERVAL_HOURS=6
      - BACKUP_MAX_COUNT=10
      # --- Timezone ---
      - TZ=UTC
    volumes:
      - ./steamcmd/ark:/home/steam/steamcmd/ark
      - ./ark-backups:/home/steam/ark-backups
    labels:
      icon: https://raw.githubusercontent.com/GMS-EC/ark-server-docker/main/Documents/logo.png
